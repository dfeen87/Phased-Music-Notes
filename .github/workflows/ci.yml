name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Python dependencies
        shell: bash
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found, skipping."
          fi

      # ---------------------------------------------------------
      # JUCE Linux Dependencies
      # ---------------------------------------------------------
      - name: Install JUCE Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxcomposite-dev \
            libxext-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libcurl4-openssl-dev \
            libasound2-dev \
            libgtk-3-dev \
            webkit2gtk-4.0 \
            pkg-config

      # ---------------------------------------------------------
      # JUCE + pybind11 FETCH
      # ---------------------------------------------------------
      - name: Remove JUCE
        run: rm -rf drivers/JUCE
        shell: bash

      - name: Clone JUCE
        run: git clone --depth 1 https://github.com/juce-framework/JUCE.git drivers/JUCE

      - name: Remove pybind11
        run: rm -rf drivers/pybind11
        shell: bash

      - name: Clone pybind11
        run: git clone --depth 1 https://github.com/pybind/pybind11.git drivers/pybind11

      # ---------------------------------------------------------
      # WINDOWS BUILD — FLAT CMD (NO LOOPS, NO DELAYED EXPANSION)
      # ---------------------------------------------------------
      - name: Windows Build (Flat CMD)
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          echo Purging MinGW...
          set PATH=%PATH:C:\mingw64\bin;=%
          set PATH=%PATH:C:\msys64\mingw64\bin;=%
          set PATH=%PATH:C:\msys64\usr\bin;=%
          set PATH=%PATH:C:\msys64\bin;=%

          echo BEFORE MSVC activation:
          where cl
          where gcc
          where g++
          echo %PATH%

          choco install ninja

          call "C:\Program Files\Microsoft Visual Studio\2022\BuildTools\Common7\Tools\VsDevCmd.bat"

          echo AFTER MSVC activation:
          where cl
          where gcc
          where g++
          echo %PATH%

          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPLUGIN_FORMATS=VST3
          cmake --build build --config Release

      # ---------------------------------------------------------
      # CMake (Linux + macOS)
      # ---------------------------------------------------------
      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.24.x'

      - name: Configure CMake (Linux/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPLUGIN_FORMATS=VST3
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPLUGIN_FORMATS="VST3;AU"
          fi

      - name: Build (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: cmake --build build --config Release

      # ---------------------------------------------------------
      # Python Test Environment
      # ---------------------------------------------------------
      - name: Install Python package
        run: pip install -e .

      - name: Add repo to PYTHONPATH
        run: echo "PYTHONPATH=$PWD:$PWD/drivers:$PYTHONPATH" >> $GITHUB_ENV

      - name: Run Python tests
        run: pytest -q

      # ---------------------------------------------------------
      # Upload Artifacts
      # ---------------------------------------------------------
      - name: Upload Windows VST3 Artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: PhasedNotes-win-VST3
          path: build/PhasedNotes_artefacts/Release/VST3/PhasedNotes.vst3

      - name: Upload macOS VST3 Artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: PhasedNotes-mac-VST3
          path: build/PhasedNotes_artefacts/VST3/PhasedNotes.vst3

      - name: Upload macOS AU Artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: PhasedNotes-mac-AU
          path: build/PhasedNotes_artefacts/AU/PhasedNotes.component
