name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Cache CMake Build
        uses: actions/cache@v3
        with:
          path: build
          key: ${{ runner.os }}-cmake-build-${{ hashFiles('CMakeLists.txt', 'drivers/**') }}
          restore-keys: |
            ${{ runner.os }}-cmake-build-

      - name: Cache JUCE
        uses: actions/cache@v3
        id: cache-juce
        with:
          path: drivers/JUCE
          key: ${{ runner.os }}-juce-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Cache pybind11
        uses: actions/cache@v3
        id: cache-pybind11
        with:
          path: drivers/pybind11
          key: ${{ runner.os }}-pybind11-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Python dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found, skipping."
          fi
        shell: bash

      # ---------------------------------------------------------
      # JUCE Linux Dependencies
      # ---------------------------------------------------------
      - name: Install JUCE Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxcomposite-dev \
            libxext-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libcurl4-openssl-dev \
            libasound2-dev \
            libgtk-3-dev \
            webkit2gtk-4.0 \
            pkg-config

      # ---------------------------------------------------------
      # JUCE + pybind11 FETCH
      # ---------------------------------------------------------
      - name: Remove JUCE (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Remove-Item -Recurse -Force drivers/JUCE

      - name: Remove JUCE (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          rm -rf drivers/JUCE

      - name: Clone JUCE
        if: steps.cache-juce.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/juce-framework/JUCE.git drivers/JUCE

      - name: Remove pybind11 (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Remove-Item -Recurse -Force drivers/pybind11

      - name: Remove pybind11 (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          rm -rf drivers/pybind11

      - name: Clone pybind11
        if: steps.cache-pybind11.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/pybind/pybind11.git drivers/pybind11

      # ---------------------------------------------------------
      # Windows Toolchain Setup
      # ---------------------------------------------------------
      - name: Setup MSBuild
        if: matrix.os == 'windows-latest'
        uses: microsoft/setup-msbuild@v1.3.1

      - name: Configure CMake (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -DCMAKE_BUILD_TYPE=Release -DPLUGIN_FORMATS=VST3

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cmake --build build --config Release

      # ---------------------------------------------------------
      # CMake (Linux + macOS)
      # ---------------------------------------------------------
      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.24.x'

      - name: Configure CMake (Linux/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPLUGIN_FORMATS=VST3
          else
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPLUGIN_FORMATS="VST3;AU"
          fi

      - name: Build (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: cmake --build build --config Release

      # ---------------------------------------------------------
      # Python Test Environment Fix
      # ---------------------------------------------------------
      - name: Install Python package
        run: pip install -e .

      - name: Add repo to PYTHONPATH
        run: |
          echo "PYTHONPATH=$PWD:$PWD/drivers:$PYTHONPATH" >> $GITHUB_ENV

      - name: Build pybind11 test module
        run: |
          cmake --build build --target pybind11_tests --config Release || true

      - name: Run Python tests
        run: pytest -q

      # ---------------------------------------------------------
      # Upload Artifacts
      # ---------------------------------------------------------
      - name: Upload Windows VST3 Artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: PhasedNotes-win-VST3
          path: build/PhasedNotes_artefacts/Release/VST3/PhasedNotes.vst3

      - name: Upload macOS VST3 Artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: PhasedNotes-mac-VST3
          path: build/PhasedNotes_artefacts/VST3/PhasedNotes.vst3

      - name: Upload macOS AU Artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: PhasedNotes-mac-AU
          path: build/PhasedNotes_artefacts/AU/PhasedNotes.component
