name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (Python + C++/JUCE)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Python setup
      # ---------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest black flake8

      # ---------------------------------------------------------
      # Python linting
      # ---------------------------------------------------------
      - name: Lint Python (flake8)
        run: flake8 phased_music_notes drivers

      - name: Format check (black)
        run: black --check phased_music_notes drivers

      # ---------------------------------------------------------
      # Python tests
      # ---------------------------------------------------------
      - name: Run Python tests
        run: pytest -q

      # ---------------------------------------------------------
      # C++ / JUCE build
      # ---------------------------------------------------------
      - name: Install CMake
        uses: lukka/get-cmake@v3

      - name: Configure CMake
        run: |
          cmake -S drivers/vst -B build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build plugin
        run: cmake --build build --config Release

      # ---------------------------------------------------------
      # Artifact upload (VST3 / AU)
      # ---------------------------------------------------------
      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PhasedNotes-${{ matrix.os }}
          path: |
            build/**/*.vst3
            build/**/*.component
            build/**/*.dll
            build/**/*.so
            build/**/*.dylib
