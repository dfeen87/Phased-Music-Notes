name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Python dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found, skipping."
          fi

      # ---------------------------------------------------------
      # JUCE + pybind11 FETCH (Fixes your CMake errors)
      # ---------------------------------------------------------

      - name: Prepare JUCE directory
        run: mkdir -p drivers/JUCE

      - name: Clone JUCE
        run: git clone --depth 1 https://github.com/juce-framework/JUCE.git drivers/JUCE

      - name: Prepare pybind11 directory
        run: mkdir -p drivers/pybind11

      - name: Clone pybind11
        run: git clone --depth 1 https://github.com/pybind/pybind11.git drivers/pybind11

      # ---------------------------------------------------------
      # CMake Build
      # ---------------------------------------------------------

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v1

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release

      # ---------------------------------------------------------
      # Python Tests
      # ---------------------------------------------------------

      - name: Run Python tests
        run: pytest -q
